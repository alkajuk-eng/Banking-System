<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Make the page responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Page title -->
  <title>Banking System</title>
  <!-- Connect CSS -->
  <link rel="stylesheet" href="index.css" />
</head>

<body>

  <!-- CREATE ACCOUNT FORM -->
  <form id="accountForm">

    <!-- Account Holder -->
    <div class="form-field">
      <label for="accountHolder">Account Holder</label>
      <input type="text" id="accountHolder" name="accountHolder" placeholder="Type account Full Name..." required />
    </div>

    <!-- Date of Birth -->
    <div class="form-field">
      <label for="birthDay">Date of Birth</label>
      <input type="date" id="birthDay" name="birthDay" required />
    </div>

    <!-- Initial Deposit -->
    <div class="form-field">
      <label for="initialDepositAmount">Initial Deposit Amount</label>
      <input type="number" id="initialDepositAmount" name="initialDepositAmount" placeholder="Type initial deposit amount..." min="0" required />
    </div>

    <!-- Create Account button -->
    <button type="submit">Create Account</button>

  </form>

  <!-- ACCOUNT SELECTION -->

  <section class="account-selection">

    <!-- Full Name -->
    <div class="account-field">
      <label for="fullName">Full Name</label>
      <select id="fullName" class="account-select">
        <option value="">Select Full Name</option>
      </select>
    </div>

    <!-- Date of Birth -->
    <div class="account-field">
      <label for="dob">Date of Birth</label>
      <select id="dob" class="account-select">
        <option value="">Select DOB</option>
      </select>
    </div>

    <!-- Account Number -->
    <div class="account-field">
      <label for="accountNumber">Account Number</label>
      <select id="accountNumber" class="account-select">
        <option value="">Select Account Number</option>
      </select>
    </div>

    <!-- Sort Code -->
    <div class="account-field">
      <label for="sortCode">Sort Code</label>
      <select id="sortCode" class="account-select">
        <option value="">Select Sort Code</option>
      </select>
    </div>

  </section>

  <!-- ACCOUNT DISPLAY -->
 
  <section id="accountDisplay" class="account-display">
      <h2>Account Details</h2>
      <div id="accountInformation" class="account-information"></div>
  </section>  

  <!-- JAVASCRIPT -->
  <script type="module" src="index.js"></script>
</body>
</html>
